[project]
name = "onchain-regime"
version = "0.1.0"
description = "Multi-asset on-chain valuation and regime analysis (LTC, BTC, DOGE) from BRK-style APIs"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "nbconvert>=7.0", "ipykernel>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
onchain-regime = "onchain_regime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onchain_regime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
